# Build the public release from tracked files and deploy it to GitHub Pages,
# on a version tag only (v0.1.0, ...), so the site always matches a release.
# Run it by hand (workflow_dispatch) for a dry run: the build and the uploaded
# site artifact are real, the deploy and release jobs are skipped, and the
# release notes the next tag would get are shown in the run summary.
# After a deploy, the release job creates the GitHub Release, its notes
# generated from the commit log by git-cliff (cliff.toml).
# Confident records only: `--all` is for people inspecting the data and never
# runs here. No API key and no network beyond installing packages.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned so the same commit builds the same bytes; Dependabot does not
    # update this, so moving to a newer image is a deliberate edit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the latest v* tag
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run col4a1a2 check
      - run: uv run col4a1a2 publish --out _site
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: uv run git-cliff --unreleased --strip header >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Pinned so the same commit builds the same bytes; Dependabot does not
    # update this, so moving to a newer image is a deliberate edit.
    runs-on: ubuntu-24.04
    # Only the job that deploys holds the Pages token; the build runs tests.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    # Pinned so the same commit builds the same bytes; Dependabot does not
    # update this, so moving to a newer image is a deliberate edit.
    runs-on: ubuntu-24.04
    # Only this job can write to the repository, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git-cliff needs the whole log and every tag
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run git-cliff --current --strip header --output "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
