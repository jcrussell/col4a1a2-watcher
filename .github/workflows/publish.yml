# Build the public release from tracked files and deploy it to GitHub Pages,
# on a version tag only (v0.1.0, ...), so the site always matches a release.
# Run it by hand (workflow_dispatch) for a dry run: the build and the uploaded
# site artifact are real, and the deploy job is skipped.
# Confident records only: `--all` is for people inspecting the data and never
# runs here. No API key and no network beyond installing packages.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run col4a1a2 check
      - run: uv run col4a1a2 publish --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only the job that deploys holds the Pages token; the build runs tests.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
