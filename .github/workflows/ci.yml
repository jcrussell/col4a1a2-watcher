# Every push and pull request: the offline tests, the integrity check, and a
# release build that is thrown away, so a broken publish shows up before a tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned so the same commit builds the same bytes; Dependabot does not
    # update this, so moving to a newer image is a deliberate edit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the latest v* tag
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run col4a1a2 check
      - run: uv run col4a1a2 publish --out _site
