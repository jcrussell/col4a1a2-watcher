# Every push and pull request: the offline tests, the integrity check, and a
# release build that is thrown away, so a broken publish shows up before a tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run col4a1a2 check
      - run: uv run col4a1a2 publish --out _site
