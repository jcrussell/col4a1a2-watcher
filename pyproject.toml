[project]
name = "col4a1a2-watcher"
dynamic = ["version"]
description = "A monthly literature watcher that builds an open per-variant table of published COL4A1/COL4A2 carriers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Jon Crussell", email = "joncrussell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
]

[project.urls]
Repository = "https://github.com/jcrussell/col4a1a2-watcher"

[project.scripts]
col4a1a2 = "col4a1a2.cli:main"
col4a1a2-dev = "col4a1a2.dev:main"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version is the latest v* tag, via hatch-vcs: tagging v0.2.0 makes the
# release 0.2.0, and an untagged commit gets a development version.
[tool.hatch.version]
source = "vcs"

# The distribution is col4a1a2-watcher but the module is col4a1a2.
[tool.hatch.build.targets.wheel]
packages = ["src/col4a1a2"]

[tool.uv]
# Rebuild the editable install when the commit or a tag changes, so the
# version uv reports follows git.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "pytest>=9.2.0",
]
