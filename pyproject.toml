[project]
name = "col4a1a2-watcher"
version = "0.1.0"
description = "A monthly literature watcher that builds an open per-variant table of published COL4A1/COL4A2 carriers"
readme = "README.md"
authors = [
    { name = "Jon Crussell", email = "joncrussell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
]

[project.scripts]
col4a1a2 = "col4a1a2.cli:main"

[tool.uv.build-backend]
# The distribution is col4a1a2-watcher but the module is col4a1a2: without this
# the backend would look for src/col4a1a2_watcher.
module-name = "col4a1a2"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
