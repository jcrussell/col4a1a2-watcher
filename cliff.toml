# git-cliff: release notes generated from the commit log. publish.yml puts
# each tag's section on its GitHub Release; nothing is committed.
# Locally: uv run git-cliff  (the whole changelog, to stdout)

[changelog]
header = """
# Changelog

Generated from the commit log. Commits before v0.1.0 predate the feat/fix/chore
convention and are listed by their subject line.\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Keep the commits from before the convention, under their own heading.
filter_unconventional = false
split_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The <!-- n --> prefixes order the groups; the template strips them.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = ".*", group = "<!-- 8 -->Earlier commits" },
]
